<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial TV Launcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

    :root {
      --bg-dark: #08080a;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-focus: rgba(255, 255, 255, 0.15);
      --focus-border: #ffffff;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3vw;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100%;
      gap: 2.5vw;
    }

    .sidebar {
      width: 5vw;
      height: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: 2.5vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2vw 0;
    }

    .sidebar-group {
      display: flex;
      flex-direction: column;
      gap: 1.5vw;
    }

    .side-icon {
      width: 3vw;
      height: 3vw;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      outline: none;
    }

    .side-icon svg {
      width: 1.4vw;
      height: 1.4vw;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .side-icon:focus, .side-icon:hover {
      background: var(--text-main);
      color: var(--bg-dark);
      transform: scale(1.1);
    }

    .side-icon.active {
      color: var(--text-main);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero {
      height: 35%;
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: 1.5vw;
      padding: 2vw 2.5vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-title {
      font-size: 2.5vw;
      font-weight: 800;
      letter-spacing: 0.1vw;
      text-transform: uppercase;
    }

    .time-display {
      font-size: 1.8vw;
      font-weight: 600;
      color: var(--text-muted);
    }

    .hero-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .hero-sub {
      font-size: 0.9vw;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.4vw;
    }

    .hero-desc {
      font-size: 1.1vw;
      font-weight: 300;
      color: #d1d1d6;
    }

    .dock-section {
      display: flex;
      flex-direction: column;
      gap: 1vw;
    }

    .section-title {
      font-size: 0.85vw;
      font-weight: 600;
      letter-spacing: 0.15vw;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1.2vw;
    }

    .app-tile {
      aspect-ratio: 16/10;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(15px);
      border-radius: 1vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.8vw;
      cursor: pointer;
      outline: none;
      color: var(--text-main);
    }

    .app-tile svg {
      width: 2vw;
      height: 2vw;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .app-name {
      font-size: 0.85vw;
      font-weight: 600;
    }

    .app-tile:focus, .app-tile:hover {
      background: var(--glass-focus);
      border-color: var(--focus-border);
      transform: translateY(-0.4vw) scale(1.03);
    }

    .utilities-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.2vw;
    }

    .util-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(15px);
      border-radius: 1vw;
      padding: 1vw 1.2vw;
      display: flex;
      align-items: center;
      gap: 1vw;
      cursor: pointer;
      outline: none;
    }

    .util-card svg {
      width: 1.5vw;
      height: 1.5vw;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .util-label {
      font-size: 0.75vw;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .util-val {
      font-size: 0.95vw;
      font-weight: 600;
    }

    .util-card:focus, .util-card:hover {
      background: var(--glass-focus);
      border-color: var(--focus-border);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-group">
        <div class="side-icon active" tabindex="0">
          <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </div>
        <div class="side-icon" tabindex="0">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
      </div>
      <div class="sidebar-group">
        <div class="side-icon" tabindex="0">
          <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="hero">
        <div class="hero-header">
          <div class="hero-title">Spatial System</div>
          <div class="time-display" id="clock">12:00 PM</div>
        </div>
        <div class="hero-body">
          <div>
            <div class="hero-sub" id="hero-app-subtitle">Focused Node</div>
            <div class="hero-desc" id="hero-app-title">Navigate using your remote control D-pad.</div>
          </div>
        </div>
      </div>

      <div class="dock-section">
        <div class="section-title">Favorites</div>
        <div class="app-grid">
          <div class="app-tile" tabindex="0" data-name="TizenTube" data-desc="Ad-free native YouTube player.">
            <svg viewBox="0 0 24 24"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.56 49.56 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></svg>
            <div class="app-name">TizenTube</div>
          </div>
          <div class="app-tile" tabindex="0" data-name="Netflix" data-desc="4K HDR streaming service.">
            <svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m7 7 10 10M7 17V7m10 10V7"/></svg>
            <div class="app-name">Netflix</div>
          </div>
          <div class="app-tile" tabindex="0" data-name="Prime Video" data-desc="Amazon movies and originals.">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M8 16H3v5"/></svg>
            <div class="app-name">Prime Video</div>
          </div>
          <div class="app-tile" tabindex="0" data-name="Disney+" data-desc="Disney & Marvel video streaming.">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m10 15 5-3-5-3z"/></svg>
            <div class="app-name">Disney+</div>
          </div>
          <div class="app-tile" tabindex="0" data-name="Speed Test" data-desc="Test network download speed.">
            <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
            <div class="app-name">Speed Test</div>
          </div>
          <div class="app-tile" tabindex="0" data-name="Inputs" data-desc="Hardware HDMI switching.">
            <svg viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            <div class="app-name">Inputs</div>
          </div>
          <div class="app-tile" tabindex="0" data-name="Settings" data-desc="System configuration menu.">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>
            <div class="app-name">Settings</div>
          </div>
        </div>
      </div>

      <div class="dock-section">
        <div class="section-title">Utilities & Status</div>
        <div class="utilities-grid">
          <div class="util-card" tabindex="0">
            <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0M12 20h.01"/></svg>
            <div>
              <div class="util-label">Network</div>
              <div class="util-val">Wi-Fi 5G</div>
            </div>
          </div>
          <div class="util-card" tabindex="0">
            <svg viewBox="0 0 24 24"><path d="M6 11 12 2l6 9"/></svg>
            <div>
              <div class="util-label">HDMI 1</div>
              <div class="util-val">Active 4K</div>
            </div>
          </div>
          <div class="util-card" tabindex="0">
            <svg viewBox="0 0 24 24"><rect width="18" height="12" x="3" y="6" rx="2"/></svg>
            <div>
              <div class="util-label">HDMI 2</div>
              <div class="util-val">Standby</div>
            </div>
          </div>
          <div class="util-card" tabindex="0">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
            <div>
              <div class="util-label">System</div>
              <div class="util-val">Optimal</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      let hrs = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      document.getElementById('clock').textContent = `${hrs}:${mins} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const heroTitle = document.getElementById('hero-app-title');
    const heroSub = document.getElementById('hero-app-subtitle');

    document.querySelectorAll('[tabindex="0"]').forEach(el => {
      el.addEventListener('focus', () => {
        heroSub.textContent = el.getAttribute('data-name') || 'Control Node';
        heroTitle.textContent = el.getAttribute('data-desc') || 'System interface component.';
      });
    });

    document.addEventListener('keydown', (e) => {
      const focusables = Array.from(document.querySelectorAll('[tabindex="0"]'));
      let index = focusables.indexOf(document.activeElement);
      if (index === -1) { focusables[0].focus(); return; }

      if (e.key === 'ArrowRight' && index < focusables.length - 1) focusables[index + 1].focus();
      if (e.key === 'ArrowLeft' && index > 0) focusables[index - 1].focus();
      if (e.key === 'ArrowDown' && index + 7 < focusables.length) focusables[index + 7].focus();
      if (e.key === 'ArrowUp' && index - 7 >= 0) focusables[index - 7].focus();
    });

    document.querySelector('.app-tile').focus();
  </script>
</body>
</html>
