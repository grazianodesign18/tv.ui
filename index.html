<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial TV Launcher</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

    :root {
      --bg-dark: #050507;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-focus: rgba(255, 255, 255, 0.15);
      --focus-border: #ffffff;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, sans-serif;
      user-select: none;
      cursor: none !important;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5vw;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100%;
      gap: 2vw;
    }

    .sidebar {
      width: 4.5vw;
      height: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: 2vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 2vw 0;
    }

    .sidebar-group {
      display: flex;
      flex-direction: column;
      gap: 1.2vw;
    }

    .side-icon {
      width: 2.8vw;
      height: 2.8vw;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      outline: none;
      transition: transform 0.2s ease;
    }

    .side-icon svg {
      width: 1.3vw;
      height: 1.3vw;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .side-icon:focus {
      background: var(--text-main);
      color: var(--bg-dark);
      transform: scale(1.1);
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero {
      height: 36%;
      background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      border-radius: 1.5vw;
      padding: 2vw 2.5vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-title {
      font-size: 2.2vw;
      font-weight: 800;
      letter-spacing: 0.1vw;
      text-transform: uppercase;
    }

    .time-display {
      font-size: 1.6vw;
      font-weight: 600;
      color: var(--text-muted);
    }

    .hero-body {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .hero-sub {
      font-size: 0.85vw;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.4vw;
      letter-spacing: 0.1vw;
    }

    .hero-desc {
      font-size: 1.05vw;
      font-weight: 300;
      color: #d1d1d6;
    }

    .dock-section {
      display: flex;
      flex-direction: column;
      gap: 0.8vw;
    }

    .section-title {
      font-size: 0.8vw;
      font-weight: 600;
      letter-spacing: 0.15vw;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1vw;
    }

    .app-tile {
      aspect-ratio: 16/10;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(15px);
      border-radius: 1vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6vw;
      outline: none;
      color: var(--text-main);
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .app-tile svg {
      width: 1.8vw;
      height: 1.8vw;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
    }

    .app-name {
      font-size: 0.8vw;
      font-weight: 600;
      letter-spacing: 0.05vw;
    }

    .app-tile:focus {
      background: var(--glass-focus);
      border-color: var(--focus-border);
      transform: translateY(-0.3vw) scale(1.04);
      box-shadow: 0 1vw 2vw rgba(0,0,0,0.6);
    }

    .utilities-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1vw;
    }

    .util-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(15px);
      border-radius: 1vw;
      padding: 0.9vw 1.2vw;
      display: flex;
      align-items: center;
      gap: 1vw;
      outline: none;
      transition: all 0.2s ease;
    }

    .util-card svg {
      width: 1.4vw;
      height: 1.4vw;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .util-label {
      font-size: 0.7vw;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05vw;
    }

    .util-val {
      font-size: 0.9vw;
      font-weight: 600;
    }

    .util-card:focus {
      background: var(--glass-focus);
      border-color: var(--focus-border);
      transform: translateY(-0.2vw);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="sidebar">
      <div class="sidebar-group">
        <div class="side-icon active" tabindex="0">
          <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        </div>
      </div>
      <div class="sidebar-group">
        <div class="side-icon" tabindex="0" onclick="launchNativeApp('11101200001')">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="hero">
        <div class="hero-header">
          <div class="hero-title">Spatial System</div>
          <div class="time-display" id="clock">12:00 PM</div>
        </div>
        <div class="hero-body">
          <div>
            <div class="hero-sub" id="hero-app-subtitle">Focused Node</div>
            <div class="hero-desc" id="hero-app-title">Navigate seamlessly using your remote D-pad. Press ENTER to launch.</div>
          </div>
        </div>
      </div>

      <div class="dock-section">
        <div class="section-title">Favorites</div>
        <div class="app-grid">
          <div class="app-tile" tabindex="0" data-appid="tizentube" data-name="TizenTube" data-desc="Launch ad-free TizenTube player.">
            <svg viewBox="0 0 24 24"><path d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.56 49.56 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></svg>
            <div class="app-name">TizenTube</div>
          </div>
          <div class="app-tile" tabindex="0" data-appid="3201507000030" data-name="Netflix" data-desc="Launch native 4K Netflix app.">
            <svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m7 7 10 10M7 17V7m10 10V7"/></svg>
            <div class="app-name">Netflix</div>
          </div>
          <div class="app-tile" tabindex="0" data-appid="3201907000007" data-name="Prime Video" data-desc="Launch Amazon Prime Video.">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M8 16H3v5"/></svg>
            <div class="app-name">Prime Video</div>
          </div>
          <div class="app-tile" tabindex="0" data-appid="3201901019048" data-name="Disney+" data-desc="Launch native Disney+ app.">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m10 15 5-3-5-3z"/></svg>
            <div class="app-name">Disney+</div>
          </div>
          <div class="app-tile" tabindex="0" data-url="https://fast.com" data-name="Speed Test" data-desc="Open Fast.com network bandwidth check.">
            <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
            <div class="app-name">Speed Test</div>
          </div>
          <div class="app-tile" tabindex="0" data-appid="org.tizen.setting" data-name="Settings" data-desc="Open native TV Settings menu.">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></svg>
            <div class="app-name">Settings</div>
          </div>
        </div>
      </div>

      <div class="dock-section">
        <div class="section-title">Utilities & Status</div>
        <div class="utilities-grid">
          <div class="util-card" tabindex="0">
            <svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0M12 20h.01"/></svg>
            <div>
              <div class="util-label">Network</div>
              <div class="util-val">Wi-Fi 5G</div>
            </div>
          </div>
          <div class="util-card" tabindex="0">
            <svg viewBox="0 0 24 24"><path d="M6 11 12 2l6 9"/></svg>
            <div>
              <div class="util-label">HDMI Status</div>
              <div class="util-val">Active 4K</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      let hrs = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const ampm = hrs >= 12 ? 'PM' : 'AM';
      hrs = hrs % 12 || 12;
      document.getElementById('clock').textContent = `${hrs}:${mins} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const heroTitle = document.getElementById('hero-app-title');
    const heroSub = document.getElementById('hero-app-subtitle');

    document.querySelectorAll('[tabindex="0"]').forEach(el => {
      el.addEventListener('focus', () => {
        heroSub.textContent = el.getAttribute('data-name') || 'Control Node';
        heroTitle.textContent = el.getAttribute('data-desc') || 'Press ENTER on remote to launch.';
      });
    });

    // Native Tizen App Launcher Function
    function launchNativeApp(appId, fallbackUrl) {
      if (window.tizen && window.tizen.application) {
        try {
          window.tizen.application.launch(appId, 
            () => console.log('App launched successfully: ' + appId),
            (err) => {
              console.error('Launch failed for ' + appId, err);
              if (fallbackUrl) window.location.href = fallbackUrl;
            }
          );
        } catch (e) {
          console.error(e);
          if (fallbackUrl) window.location.href = fallbackUrl;
        }
      } else if (fallbackUrl) {
        window.location.href = fallbackUrl;
      } else {
        alert('Launching App ID: ' + appId + ' (Requires native Tizen environment)');
      }
    }

    // Trigger on Enter Key press or Click
    document.querySelectorAll('.app-tile').forEach(tile => {
      const action = () => {
        const appId = tile.getAttribute('data-appid');
        const url = tile.getAttribute('data-url');
        if (appId) {
          launchNativeApp(appId, url);
        } else if (url) {
          window.location.href = url;
        }
      };

      tile.addEventListener('click', action);
      tile.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') action();
      });
    });

    // Remote Control D-Pad Navigation
    document.addEventListener('keydown', (e) => {
      const focusables = Array.from(document.querySelectorAll('[tabindex="0"]'));
      let index = focusables.indexOf(document.activeElement);
      if (index === -1) { focusables[0].focus(); return; }

      if (e.key === 'ArrowRight' && index < focusables.length - 1) focusables[index + 1].focus();
      if (e.key === 'ArrowLeft' && index > 0) focusables[index - 1].focus();
      if (e.key === 'ArrowDown' && index + 6 < focusables.length) focusables[index + 6].focus();
      if (e.key === 'ArrowUp' && index - 6 >= 0) focusables[index - 6].focus();
    });

    document.querySelector('.app-tile').focus();
  </script>
</body>
</html>
